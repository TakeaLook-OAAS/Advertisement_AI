# Dev overrides
#device_id: "cam_01"
device_id: "dddddddd-0000-0000-0000-000000000001"
source: "data/samples/20260716_165147.mp4"

display:
  output_video: false
  output_video_path: "data/output/output_20260716_165147(1).mp4"
  font_scale: 0.7
  thickness: 2
  draw_bbox: true
  draw_crop_bbox: true
  draw_fps: true
  draw_headpose: true
  draw_gaze: true
  draw_roi: true
  draw_look: true
  draw_gender_age: true

models:
  yolo:
    device: "cuda"
    #device: "cpu"
    model: "weights/yolo/yolov8n.pt"      # nano model (~6MB, auto-download)
    conf: 0.5                 # confidence threshold
    classes: [0]              # 0=person in COCO
  tracker:
    iou_threshold: 0.3
    max_lost: 30              # 이 프레임 수만큼 미매칭이면 track 삭제
    img_w: 1920               # 입력 영상 해상도 (ByteTrack 내부 좌표 스케일링용)
    img_h: 1080
  face:
    device: "CPU"
    weights: "weights/face_detection/face-detection-adas-0001.xml"
    conf_thresh: 0.5          # confidence threshold
    min_face_size: 30         # 최소 얼굴 크기 (pixel). 이보다 작으면 bbox 그대로 반환
  headpose:
    device: "cuda"
    #device: "cpu"             # cpu / cuda
    weights: "weights/headpose/6DRepNet_300W_LP_AFLW2000.pth"  # 가중치 경로
    min_face_size: 30         # 최소 얼굴 크기 (pixel). 이보다 작으면 실패 처리
  eye:
    device: "CPU"
    weights: "weights/eye_detection/facial-landmarks-35-adas-0002.xml"
    min_eye_size: 10
  gaze:
    device: "CPU"
    weights: "weights/gaze/gaze-estimation-adas-0002.xml"
  mivolo:
    device: "cuda"
    #device: "cpu"
    model: "weights/age_gender/model_imdb_cross_person_4.22_99.46.pth"
    min_face_size: 20
    min_person_size: 40
    use_persons: true

pipeline:
  frame_skip: 1
# N프레임마다 1번 처리 (1=매 프레임, 10=10프레임마다, 30=30프레임마다)
# 테스트 목적이면 5~10, 실제 분석 결과가 중요하면 1~3을 권장

logic:
  attention:
    threshold_deg: 30.0        # distance_adaptive 비활성/미설정 시 fallback
    distance_adaptive:
      enabled: true            # 캘리브레이션 값 채운 뒤 true로
      ad_width_m: 1.0           # TODO: 실제 광고판 폭(m)으로 교체
      ad_height_m: 1.0          # TODO: 실제 광고판 높이(m)로 교체
      ref_distance_m: 1.0       # TODO: 기준 촬영 거리(m)
      ref_face_height_px: 290.0  # TODO: 그 거리에서 측정한 얼굴 crop 평균 높이(px)
      min_threshold_deg: 5.0
      max_threshold_deg: 45.0
    hysteresis:
      enabled: true
      enter_frames: 3   # OFF->ON: raw True가 이 프레임 수만큼 연속돼야 확정 (30fps 기준 ~100ms)
      exit_frames: 8    # ON->OFF: raw False가 이 프레임 수만큼 연속돼야 확정 (30fps 기준 ~270ms)

output:
  json_dir: "data/output/segments/"
  ad_cycle:
    durations_s: [40]

backend:
  #url: "http://localhost:8000/events/"
  url: "http://back_dev:8000/events/"